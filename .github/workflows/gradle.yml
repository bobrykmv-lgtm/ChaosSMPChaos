name: ⚙️ Build ChaosSMPChaos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 🔨 Compile Plugin
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔍 Check Java Version
        run: java -version

      - name: 🏗️ Build ChaosSMPChaos
        run: ./gradlew clean build --no-daemon

      - name: 📦 Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChaosSMPChaos-Artifact
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
