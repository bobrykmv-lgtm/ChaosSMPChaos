name: Build ChaosSMPChaos

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.3.0
        with:
          gradle-version: '8.10.2'

      - name: Check plugin.yml source
        run: |
          test -f src/main/resources/plugin.yml
          grep -q '^commands:' src/main/resources/plugin.yml
          echo "plugin.yml source found."

      - name: Build Plugin
        run: gradle clean build --no-daemon

      - name: Verify JAR contents
        run: |
          JAR="build/libs/ChaosSMPChaos-1.0.0.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -qx "plugin.yml"
          echo "plugin.yml successfully included in JAR."

      - name: Upload Plugin
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ChaosSMPChaos-Artifact
          path: build/libs/ChaosSMPChaos-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
