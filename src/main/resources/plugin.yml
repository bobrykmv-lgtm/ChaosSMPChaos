name: ChaosSMPChaos
version: 1.0.0
main: com.chaossmp.chaos.ChaosSMPChaos
api-version: '1.21'
author: Developer
description: Плагин для управления системой хаоса на ChaosSMP.

commands:
  chaos:
    description: Management system for chaos
    usage: /<command>
    permission: chaossmpchaos.use

permissions:
  chaossmpchaos.use:
    description: Доступ к командам просмотра хаосов
    default: true
  chaossmpchaos.admin:
    description: Административное управление хаосами
    default: op
