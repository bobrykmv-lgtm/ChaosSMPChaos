name: ChaosSMPChaos
version: 1.0.0
main: com.chaossmp.chaos.ChaosSMPChaos
api-version: '1.21'
author: Developer
description: Плагін для керування системою хаосу на ChaosSMP.

commands:
  chaos:
    description: Управление системой хаосов
    usage: /<command>
    permission: chaossmpchaos.use
    aliases:
      - хаос

permissions:
  chaossmpchaos.use:
    description: Доступ к команде /chaos
    default: true
  chaossmpchaos.admin:
    description: Административное управление хаосами
    default: op
